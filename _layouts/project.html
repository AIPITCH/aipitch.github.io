---
layout: default
---
<article class="project-detail">
  <header class="page-hero project-hero">
    <div class="container narrow">
      <a class="back-link" href="{{ '/projects/' | relative_url }}">← All contributions</a>
      <p class="eyebrow light">{{ page.kind | default: "AIPITCH contribution" }}</p>
      <h1>{{ page.title }}</h1>
      <p>{{ page.summary }}</p>
      <div class="project-meta"><span>Developed by</span><strong>{{ page.member }}</strong></div>
    </div>
  </header>
  <div class="container project-body">
    <aside class="project-sidebar">
      <p class="eyebrow">Project links</p>
      <a class="button" href="{{ page.repository }}" rel="noopener" target="_blank">View source on GitHub ↗</a>
      <dl><dt>Contributor</dt><dd>{{ page.member }}</dd><dt>License</dt><dd>{{ page.license }}</dd><dt>Status</dt><dd>{{ page.status }}</dd></dl>
    </aside>
    <div class="project-content">{{ content }}</div>
  </div>
</article>
